name: Bootstrap GraviStudio repository

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/**'
      - '.github/workflows/bootstrap.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct production source
        shell: bash
        run: |
          cat .bootstrap/chunks/*.b64 | tr -d '\n\r' | base64 -d > /tmp/gravistudio-source.zip
          unzip -t /tmp/gravistudio-source.zip
          unzip -o /tmp/gravistudio-source.zip -d .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify source
        run: |
          npm run check
          npm test

      - name: Materialize PNG brand and UI previews
        run: |
          python -m pip install --disable-pip-version-check cairosvg
          python - <<'PY'
          import cairosvg
          pairs = [
            ('docs/assets/brand/logo.svg', 'docs/assets/brand/logo.png', 512, 512),
            ('docs/assets/screenshots/dashboard.svg', 'docs/assets/screenshots/dashboard.png', 1600, 960),
            ('docs/assets/screenshots/initialize.svg', 'docs/assets/screenshots/initialize.png', 1600, 960),
            ('docs/assets/screenshots/skills-engines.svg', 'docs/assets/screenshots/skills-engines.png', 1600, 960),
          ]
          for src, dst, w, h in pairs:
              cairosvg.svg2png(url=src, write_to=dst, output_width=w, output_height=h)
          PY

      - name: Build precompiled packages
        run: |
          rm -rf dist .release-stage
          mkdir -p dist .release-stage/GraviStudio-v0.1.0
          rsync -a ./ .release-stage/GraviStudio-v0.1.0/ --exclude '.git' --exclude 'dist' --exclude 'node_modules' --exclude '.gravistudio' --exclude '.release-stage'
          (cd .release-stage && zip -qr ../dist/GraviStudio-v0.1.0-prebuilt.zip GraviStudio-v0.1.0)
          zip -qr dist/gravistudio-antigravity-plugin-v0.1.0.zip plugin
          (cd dist && sha256sum GraviStudio-v0.1.0-prebuilt.zip gravistudio-antigravity-plugin-v0.1.0.zip > SHA256SUMS.txt)
          rm -rf .release-stage

      - name: Publish source, assets, and prebuilt packages
        run: |
          # GitHub's Actions token cannot create/update workflow files.
          # Keep the already-authorized bootstrap workflow unchanged for this push;
          # the final CI/release workflows are installed by the repository connector afterward.
          rm -rf .github/workflows
          mkdir -p .github/workflows
          git show HEAD:.github/workflows/bootstrap.yml > .github/workflows/bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: publish production-ready GraviStudio' || exit 0
          git push
