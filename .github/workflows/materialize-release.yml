# GraviStudio release asset materializer
name: Materialize release assets

on:
  push:
    branches: [main]
    paths-ignore:
      - 'dist/**'
      - 'docs/assets/**/*.png'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare image renderer
        run: python -m pip install --disable-pip-version-check cairosvg

      - name: Materialize PNG previews
        run: |
          python - <<'PY'
          import cairosvg
          from pathlib import Path
          pairs = [
            ('docs/assets/brand/logo.svg', 'docs/assets/brand/logo.png', 512, 512),
            ('docs/assets/screenshots/dashboard.svg', 'docs/assets/screenshots/dashboard.png', 1600, 960),
            ('docs/assets/screenshots/initialize.svg', 'docs/assets/screenshots/initialize.png', 1600, 960),
            ('docs/assets/screenshots/skills-engines.svg', 'docs/assets/screenshots/skills-engines.png', 1600, 960),
          ]
          for src, dst, w, h in pairs:
              Path(dst).parent.mkdir(parents=True, exist_ok=True)
              cairosvg.svg2png(url=src, write_to=dst, output_width=w, output_height=h)
          PY

      - name: Build ready-to-run packages
        run: |
          rm -rf dist .release-stage
          mkdir -p dist .release-stage/GraviStudio-v0.1.0
          rsync -a ./ .release-stage/GraviStudio-v0.1.0/ \
            --exclude '.git' --exclude 'dist' --exclude 'node_modules' --exclude '.gravistudio' --exclude '.release-stage'
          (cd .release-stage && zip -qr ../dist/GraviStudio-v0.1.0-prebuilt.zip GraviStudio-v0.1.0)
          zip -qr dist/gravistudio-antigravity-plugin-v0.1.0.zip plugin

      - name: Build installable VSIX extension
        shell: bash
        run: |
          EXT=.release-stage/vsix/extension
          mkdir -p "$EXT/media" "$EXT/resources"
          cp -a plugin "$EXT/resources/plugin"
          cp docs/assets/brand/logo.png "$EXT/media/icon.png"
          cat > "$EXT/media/sidebar.svg" <<'SVG'
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h6A2.5 2.5 0 0 1 15 6.5v11a2.5 2.5 0 0 1-2.5 2.5h-6A2.5 2.5 0 0 1 4 17.5v-11Z" stroke="currentColor" stroke-width="1.8"/><path d="m9 9 4 3-4 3V9Z" fill="currentColor"/><path d="M18 7v10M20 9v6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          SVG
          cat > "$EXT/package.json" <<'JSON'
          {"name":"gravistudio","displayName":"GraviStudio","description":"Antigravity-powered AI Video Studio dashboard and skill initializer.","version":"0.2.0","publisher":"cassielxyz","license":"MIT","engines":{"vscode":"^1.85.0"},"categories":["Other","Machine Learning"],"activationEvents":["onView:gravistudio.dashboard","onCommand:gravistudio.openStudio","onCommand:gravistudio.initialize"],"main":"./extension.js","icon":"media/icon.png","contributes":{"commands":[{"command":"gravistudio.openStudio","title":"GraviStudio: Open AI Video Studio"},{"command":"gravistudio.initialize","title":"GraviStudio: Initialize Studio"}],"viewsContainers":{"activitybar":[{"id":"gravistudio","title":"GraviStudio","icon":"media/sidebar.svg"}]},"views":{"gravistudio":[{"type":"webview","id":"gravistudio.dashboard","name":"AI Video Studio"}]},"configuration":{"title":"GraviStudio","properties":{"gravistudio.freeMode":{"type":"boolean","default":true},"gravistudio.skillsPath":{"type":"string","default":"~/.gemini/antigravity/skills"}}}}}
          JSON
          cat > "$EXT/extension.js" <<'JS'
          const vscode=require('vscode'),fs=require('fs'),path=require('path'),os=require('os'),cp=require('child_process');
          const cats=[['Product Video','Brag + HyperFrames'],['Motion Graphics','HyperFrames'],['Website → Video','HyperFrames'],['Auto Shorts','AutoClip / SupoClip'],['AI Director','OpenMontage'],['Live Avatar','PersonaLive'],['Video Editor','FFmpeg'],['Reel Maker','Asset Agent + HyperFrames']];
          const repos={brag:'https://github.com/latent-spaces/brag.git',hyperframes:'https://github.com/heygen-com/hyperframes.git',autoclip:'https://github.com/artbyjazi/autoclip.git',supoclip:'https://github.com/FujiwaraChoki/supoclip.git',openmontage:'https://github.com/n0-space/openmontage.git',personalive:'https://github.com/gskfilmmaker/personalive.git'};
          const home=p=>p.startsWith('~/')?path.join(os.homedir(),p.slice(2)):p, ready=c=>cp.spawnSync(process.platform==='win32'?'where':'sh',process.platform==='win32'?[c]:['-lc',`command -v ${c}`],{shell:process.platform==='win32'}).status===0;
          function copy(src,dst){fs.mkdirSync(dst,{recursive:true});for(const e of fs.readdirSync(src,{withFileTypes:true})){const a=path.join(src,e.name),b=path.join(dst,e.name);e.isDirectory()?copy(a,b):fs.copyFileSync(a,b)}}
          function skillsPath(){return home(vscode.workspace.getConfiguration('gravistudio').get('skillsPath','~/.gemini/antigravity/skills'))}
          function installSkills(ctx){const src=path.join(ctx.extensionPath,'resources','plugin','skills'),dst=skillsPath();fs.mkdirSync(dst,{recursive:true});for(const n of fs.readdirSync(src))if(fs.statSync(path.join(src,n)).isDirectory())copy(path.join(src,n),path.join(dst,n))}
          async function installModules(){if(!ready('git'))return vscode.window.showErrorMessage('Git is required for optional video engines.');const q=await vscode.window.showQuickPick([{label:'Brag',id:'brag',picked:true},{label:'HyperFrames',id:'hyperframes',picked:true},{label:'AutoClip',id:'autoclip'},{label:'SupoClip',id:'supoclip'},{label:'OpenMontage',id:'openmontage'},{label:'PersonaLive',id:'personalive',description:'Experimental · GPU required'}],{canPickMany:true,title:'Optional GraviStudio engines'});if(!q)return;const root=path.join(os.homedir(),'.gravistudio','modules');fs.mkdirSync(root,{recursive:true});for(const x of q){const d=path.join(root,x.id);if(fs.existsSync(path.join(d,'.git')))continue;const r=cp.spawnSync('git',['clone','--depth','1',repos[x.id],d],{stdio:'inherit',shell:process.platform==='win32'});if(r.status!==0)vscode.window.showWarningMessage(`Could not install ${x.label}.`)}}
          function state(ctx){const root=skillsPath(),bundled=path.join(ctx.extensionPath,'resources','plugin','skills'),skills={};for(const n of fs.readdirSync(bundled))if(fs.statSync(path.join(bundled,n)).isDirectory())skills[n]=fs.existsSync(path.join(root,n,'SKILL.md'));const mods={};for(const n of Object.keys(repos))mods[n]=fs.existsSync(path.join(os.homedir(),'.gravistudio','modules',n));return{agy:ready('agy'),ffmpeg:ready('ffmpeg'),git:ready('git'),skills,mods}}
          function html(s){const cards=cats.map((c,i)=>`<button onclick="vscode.postMessage({t:'job',i:${i}})"><b>${c[0]}</b><small>${c[1]}</small></button>`).join('');const loaded=Object.values(s.skills).filter(Boolean).length,total=Object.keys(s.skills).length;return`<!doctype html><meta name="viewport" content="width=device-width"><style>body{font:13px Segoe UI;background:#090a0f;color:#f7f7fb;padding:16px}header{padding:20px;border:1px solid #39304f;border-radius:18px;background:linear-gradient(135deg,#291b49,#111c27)}h1{margin:0;font-size:28px}.actions{display:flex;gap:8px;margin-top:14px}button{color:#fff;background:#141721;border:1px solid #303548;border-radius:12px;padding:12px;text-align:left;cursor:pointer}.primary{background:linear-gradient(90deg,#7c3aed,#db2777);border:0}.status{margin:14px 0;padding:10px;border:1px solid #262a38;border-radius:10px;color:#b5bac9}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:9px}button b,button small{display:block}small{color:#8f97ad;margin-top:6px}.ok{color:#34d399}.bad{color:#fbbf24}</style><header><small>ANTIGRAVITY VIDEO STUDIO</small><h1>GraviStudio</h1><p>Route each video job to the right skill and engine.</p><div class="actions"><button class="primary" onclick="vscode.postMessage({t:'init'})">Initialize Studio</button><button onclick="vscode.postMessage({t:'verify'})">Verify</button></div></header><div class="status"><span class="${s.agy?'ok':'bad'}">● Antigravity ${s.agy?'ready':'missing'}</span> · FFmpeg ${s.ffmpeg?'ready':'missing'} · ${loaded}/${total} skills loaded</div><h3>Video workspaces</h3><div class="grid">${cards}</div>`}
          async function job(i){if(!ready('agy'))return vscode.window.showErrorMessage('Antigravity CLI (agy) is not available.');const b=await vscode.window.showInputBox({title:`New ${cats[i][0]}`,prompt:'Describe the video you want'});if(!b)return;const root=vscode.workspace.workspaceFolders?.[0]?.uri.fsPath;if(!root)return vscode.window.showErrorMessage('Open a project folder first.');fs.mkdirSync(path.join(root,'.gravistudio'),{recursive:true});fs.writeFileSync(path.join(root,'.gravistudio','checkpoint.json'),JSON.stringify({category:cats[i][0],brief:b,stage:'requirements',completedStages:[]},null,2));const prompt=`GraviStudio job. Category: ${cats[i][0]}. Route: ${cats[i][1]}. Brief: ${b}. Read and update .gravistudio/checkpoint.json after requirements, storyboard, assets, composition, render and qc. Use installed GraviStudio skills. Free Mode is ${vscode.workspace.getConfiguration('gravistudio').get('freeMode',true)?'ON; do not use paid providers':'OFF'}. Never claim success before video QC passes.`;const t=vscode.window.createTerminal({name:`GraviStudio · ${cats[i][0]}`,cwd:root});t.show();t.sendText(`agy -p ${JSON.stringify(prompt)} --output-format stream-json`)}
          function activate(ctx){let view;const provider={resolveWebviewView(v){view=v;v.webview.options={enableScripts:true};const post=()=>v.webview.html=html(state(ctx));post();v.webview.onDidReceiveMessage(async m=>{if(m.t==='init'){installSkills(ctx);await installModules();post();vscode.window.showInformationMessage('GraviStudio initialized and verified.')}if(m.t==='verify')post();if(m.t==='job')job(m.i)})}};ctx.subscriptions.push(vscode.window.registerWebviewViewProvider('gravistudio.dashboard',provider),vscode.commands.registerCommand('gravistudio.initialize',async()=>{installSkills(ctx);await installModules();vscode.window.showInformationMessage('GraviStudio initialized.')}),vscode.commands.registerCommand('gravistudio.openStudio',()=>vscode.commands.executeCommand('workbench.view.extension.gravistudio')))}
          module.exports={activate};
          JS
          cat > "$EXT/README.md" <<'MD'
          # GraviStudio
          Install the VSIX, click the GraviStudio Activity Bar icon, then click **Initialize Studio**. Bundled Antigravity skills are installed and verified locally; optional open-source video engines can be downloaded from the initializer.
          MD
          cat > .release-stage/vsix/extension.vsixmanifest <<'XML'
          <?xml version="1.0" encoding="utf-8"?><PackageManifest Version="2.0.0" xmlns="http://schemas.microsoft.com/developer/vsx-schema/2011"><Metadata><Identity Language="en-US" Id="gravistudio" Version="0.2.0" Publisher="cassielxyz"/><DisplayName>GraviStudio</DisplayName><Description xml:space="preserve">Antigravity-powered AI Video Studio dashboard and skill initializer.</Description><Categories>Other,Machine Learning</Categories><Properties><Property Id="Microsoft.VisualStudio.Code.Engine" Value="^1.85.0"/><Property Id="Microsoft.VisualStudio.Services.Links.Repository" Value="https://github.com/cassielxyz/GravyStudio"/></Properties></Metadata><Installation><InstallationTarget Id="Microsoft.VisualStudio.Code" Version="[1.85.0,)"/></Installation><Dependencies/><Assets><Asset Type="Microsoft.VisualStudio.Code.Manifest" Path="extension/package.json" Addressable="true"/><Asset Type="Microsoft.VisualStudio.Services.Content.Details" Path="extension/README.md" Addressable="true"/><Asset Type="Microsoft.VisualStudio.Services.Icons.Default" Path="extension/media/icon.png" Addressable="true"/></Assets></PackageManifest>
          XML
          cat > .release-stage/vsix/'[Content_Types].xml' <<'XML'
          <?xml version="1.0" encoding="utf-8"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="json" ContentType="application/json"/><Default Extension="js" ContentType="application/javascript"/><Default Extension="md" ContentType="text/markdown"/><Default Extension="png" ContentType="image/png"/><Default Extension="svg" ContentType="image/svg+xml"/><Default Extension="xml" ContentType="text/xml"/><Override PartName="/extension.vsixmanifest" ContentType="text/xml"/></Types>
          XML
          (cd .release-stage/vsix && zip -qr ../../dist/GraviStudio-0.2.0.vsix '[Content_Types].xml' extension.vsixmanifest extension)
          unzip -t dist/GraviStudio-0.2.0.vsix
          test "$(unzip -p dist/GraviStudio-0.2.0.vsix extension/package.json | python -c 'import json,sys; print(json.load(sys.stdin)["name"])')" = gravistudio
          (cd dist && sha256sum GraviStudio-v0.1.0-prebuilt.zip gravistudio-antigravity-plugin-v0.1.0.zip GraviStudio-0.2.0.vsix > SHA256SUMS.txt)
          rm -rf .release-stage

      - name: Commit generated binaries
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist docs/assets/brand/logo.png docs/assets/screenshots/*.png
          git diff --cached --quiet && exit 0
          git commit -m 'build: materialize GraviStudio VSIX and release assets'
          git push
