# GraviStudio release asset materializer
name: Materialize release assets

on:
  push:
    branches: [main]
    paths-ignore:
      - 'dist/**'
      - 'docs/assets/**/*.png'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare image renderer
        run: python -m pip install --disable-pip-version-check cairosvg

      - name: Materialize PNG previews
        run: |
          python - <<'PY'
          import cairosvg
          from pathlib import Path
          pairs = [
            ('docs/assets/brand/logo.svg', 'docs/assets/brand/logo.png', 512, 512),
            ('docs/assets/screenshots/dashboard.svg', 'docs/assets/screenshots/dashboard.png', 1600, 960),
            ('docs/assets/screenshots/initialize.svg', 'docs/assets/screenshots/initialize.png', 1600, 960),
            ('docs/assets/screenshots/skills-engines.svg', 'docs/assets/screenshots/skills-engines.png', 1600, 960),
          ]
          for src, dst, w, h in pairs:
              Path(dst).parent.mkdir(parents=True, exist_ok=True)
              cairosvg.svg2png(url=src, write_to=dst, output_width=w, output_height=h)
          PY

      - name: Verify VSIX extension source
        run: |
          node --check extension/extension.js
          node --check extension/src/data.js
          node --check extension/src/jobs.js
          node --check extension/src/launch-command.js
          node --check extension/src/provider.js
          node --check extension/src/system.js
          node --check extension/media/dashboard.js
          python -m json.tool extension/package.json >/dev/null
          python -m json.tool extension/resources/registry.json >/dev/null
          test -s extension/media/wordmark.png

      - name: Build ready-to-run packages
        run: |
          rm -rf dist .release-stage
          mkdir -p dist .release-stage/GraviStudio-v0.1.0
          rsync -a ./ .release-stage/GraviStudio-v0.1.0/ \
            --exclude '.git' --exclude 'dist' --exclude 'node_modules' --exclude '.gravistudio' --exclude '.release-stage'
          (cd .release-stage && zip -qr ../dist/GraviStudio-v0.1.0-prebuilt.zip GraviStudio-v0.1.0)
          zip -qr dist/gravistudio-antigravity-plugin-v0.1.0.zip plugin

      - name: Build installable VSIX extension
        shell: bash
        run: |
          EXT=.release-stage/vsix/extension
          mkdir -p .release-stage/vsix
          rsync -a extension/ "$EXT/"
          mkdir -p "$EXT/media" "$EXT/resources"
          rm -rf "$EXT/resources/plugin"
          cp -a plugin "$EXT/resources/plugin"
          cp docs/assets/brand/logo.png "$EXT/media/icon.png"
          cp LICENSE "$EXT/LICENSE"

          cat > .release-stage/vsix/extension.vsixmanifest <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <PackageManifest Version="2.0.0" xmlns="http://schemas.microsoft.com/developer/vsx-schema/2011">
            <Metadata>
              <Identity Language="en-US" Id="gravistudio" Version="0.2.3" Publisher="cassielxyz" />
              <DisplayName>GraviStudio</DisplayName>
              <Description xml:space="preserve">Antigravity-powered AI Video Studio with skill initialization, routing, assets, checkpoints and video QC.</Description>
              <Tags>antigravity,gemini,video,ai-video,ffmpeg,hyperframes,brag,autoclip</Tags>
              <Categories>Other,Machine Learning</Categories>
              <GalleryFlags>Public</GalleryFlags>
              <Properties>
                <Property Id="Microsoft.VisualStudio.Code.Engine" Value="^1.85.0" />
                <Property Id="Microsoft.VisualStudio.Services.Links.Source" Value="https://github.com/cassielxyz/GravyStudio" />
                <Property Id="Microsoft.VisualStudio.Services.Links.Repository" Value="https://github.com/cassielxyz/GravyStudio" />
                <Property Id="Microsoft.VisualStudio.Services.Links.Support" Value="https://github.com/cassielxyz/GravyStudio/issues" />
              </Properties>
              <License>extension/LICENSE</License>
            </Metadata>
            <Installation><InstallationTarget Id="Microsoft.VisualStudio.Code" Version="[1.85.0,)" /></Installation>
            <Dependencies />
            <Assets>
              <Asset Type="Microsoft.VisualStudio.Code.Manifest" Path="extension/package.json" Addressable="true" />
              <Asset Type="Microsoft.VisualStudio.Services.Content.Details" Path="extension/README.md" Addressable="true" />
              <Asset Type="Microsoft.VisualStudio.Services.Content.Changelog" Path="extension/CHANGELOG.md" Addressable="true" />
              <Asset Type="Microsoft.VisualStudio.Services.Icons.Default" Path="extension/media/icon.png" Addressable="true" />
              <Asset Type="Microsoft.VisualStudio.Services.Content.License" Path="extension/LICENSE" Addressable="true" />
            </Assets>
          </PackageManifest>
          XML

          cat > .release-stage/vsix/'[Content_Types].xml' <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
            <Default Extension="json" ContentType="application/json"/>
            <Default Extension="js" ContentType="application/javascript"/>
            <Default Extension="css" ContentType="text/css"/>
            <Default Extension="md" ContentType="text/markdown"/>
            <Default Extension="png" ContentType="image/png"/>
            <Default Extension="svg" ContentType="image/svg+xml"/>
            <Default Extension="xml" ContentType="text/xml"/>
            <Default Extension="txt" ContentType="text/plain"/>
            <Override PartName="/extension.vsixmanifest" ContentType="text/xml"/>
          </Types>
          XML

          (cd .release-stage/vsix && zip -qr ../../dist/GraviStudio-0.2.3.vsix '[Content_Types].xml' extension.vsixmanifest extension)
          unzip -t dist/GraviStudio-0.2.3.vsix
          test "$(unzip -p dist/GraviStudio-0.2.3.vsix extension/package.json | python -c 'import json,sys; print(json.load(sys.stdin)["name"])')" = gravistudio
          test "$(unzip -p dist/GraviStudio-0.2.3.vsix extension/package.json | python -c 'import json,sys; print(json.load(sys.stdin)["version"])')" = 0.2.3
          unzip -l dist/GraviStudio-0.2.3.vsix | grep -q 'extension/resources/plugin/skills/video-studio/SKILL.md'
          unzip -l dist/GraviStudio-0.2.3.vsix | grep -q 'extension/media/dashboard.css'
          unzip -l dist/GraviStudio-0.2.3.vsix | grep -q 'extension/media/wordmark.png'
          unzip -l dist/GraviStudio-0.2.3.vsix | grep -q 'extension/src/system.js'
          (cd dist && sha256sum GraviStudio-v0.1.0-prebuilt.zip gravistudio-antigravity-plugin-v0.1.0.zip GraviStudio-0.2.3.vsix > SHA256SUMS.txt)
          rm -rf .release-stage

      - name: Commit generated binaries
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist docs/assets/brand/logo.png docs/assets/screenshots/*.png
          git diff --cached --quiet && exit 0
          git commit -m 'build: materialize GraviStudio VSIX and release assets'
          git push
